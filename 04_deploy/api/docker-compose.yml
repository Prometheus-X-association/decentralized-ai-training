services:
  bb01-api:
    image: bb01-api
    build:
      context: ../../
      dockerfile: 04_deploy/api/bb01-api/Dockerfile
    ports:
      - 8000:8000

  consumer:
    image: consumer
    build:
      context: ../../
      dockerfile: 04_deploy/api/consumer/Dockerfile
    ports:
      - 8001:8000

  tester:
    image: tester
    build:
      context: ../..
      dockerfile: 04_deploy/api/tester/Dockerfile
    ports:
      - 8002:8000

