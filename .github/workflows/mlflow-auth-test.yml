name: Mlflow Auth Tests

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:
  push:

jobs:
  mlflow-auth-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.12  

      - name: Install dependencies
        run: pip install -r requirements-test.txt

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ secrets.SECRET_GITHUB_USER }}
          password: ${{ secrets.SECRET_GITHUB_TOKEN }}

      - name: Run auth test suite
        # env:
        #   ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        #   AGGREGATOR_PASSWORD: ${{ secrets.AGGREGATOR_PASSWORD }}
        #   MODEL_USER_PASSWORD: ${{ secrets.MODEL_USER_PASSWORD }}
        run: pytest 05_test/mlflow_auth_test
        
      # Always run the cleanup step, even if the tests fail
      - name: Clean up container
        if: always()
        run: docker rm -f mlflow_auth_test || true